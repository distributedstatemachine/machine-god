name: Benchmark evidence

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: benchmark-${{ github.sha }}
  cancel-in-progress: false

jobs:
  change-classification:
    name: Change classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.route.outputs.full }}
      docs_only: ${{ steps.route.outputs.docs_only }}
      core_api_docs: ${{ steps.route.outputs.core_api_docs }}
      testkit_docs: ${{ steps.route.outputs.testkit_docs }}
      compatibility_docs: ${{ steps.route.outputs.compatibility_docs }}
      vision_docs: ${{ steps.route.outputs.vision_docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed paths
        id: paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.ref }}
          predicate-quantifier: some-with-excludes
          filters: |
            documentation:
              - 'README.md'
              - 'docs/**/*.md'
            non_documentation:
              - '**'
              - '!README.md'
              - '!docs/**/*.md'
            core_api_docs:
              - 'docs/core-api.md'
            testkit_docs:
              - 'docs/testkit.md'
            compatibility_docs:
              - 'docs/compatibility.md'
            vision_docs:
              - 'docs/vision.md'
      - name: Select the applicable gate
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          DOCUMENTATION: ${{ steps.paths.outputs.documentation }}
          NON_DOCUMENTATION: ${{ steps.paths.outputs.non_documentation }}
          CORE_API_DOCS: ${{ steps.paths.outputs.core_api_docs }}
          TESTKIT_DOCS: ${{ steps.paths.outputs.testkit_docs }}
          COMPATIBILITY_DOCS: ${{ steps.paths.outputs.compatibility_docs }}
          VISION_DOCS: ${{ steps.paths.outputs.vision_docs }}
        shell: bash
        run: |
          set -euo pipefail

          full=true
          docs_only=false
          core_api_docs=false
          testkit_docs=false
          compatibility_docs=false
          vision_docs=false

          valid=true
          for value in \
            "${DOCUMENTATION}" \
            "${NON_DOCUMENTATION}" \
            "${CORE_API_DOCS}" \
            "${TESTKIT_DOCS}" \
            "${COMPATIBILITY_DOCS}" \
            "${VISION_DOCS}"
          do
            if [[ "${value}" != "true" && "${value}" != "false" ]]; then
              valid=false
            fi
          done

          if [[ "${EVENT_NAME}" != "workflow_dispatch" && "${valid}" == "true" ]]; then
            case "${DOCUMENTATION}:${NON_DOCUMENTATION}" in
              true:false)
                full=false
                docs_only=true
                core_api_docs="${CORE_API_DOCS}"
                testkit_docs="${TESTKIT_DOCS}"
                compatibility_docs="${COMPATIBILITY_DOCS}"
                vision_docs="${VISION_DOCS}"
                ;;
            esac
          fi

          # shellcheck disable=SC2129
          echo "full=${full}" >> "${GITHUB_OUTPUT}"
          echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"
          echo "core_api_docs=${core_api_docs}" >> "${GITHUB_OUTPUT}"
          echo "testkit_docs=${testkit_docs}" >> "${GITHUB_OUTPUT}"
          echo "compatibility_docs=${compatibility_docs}" >> "${GITHUB_OUTPUT}"
          echo "vision_docs=${vision_docs}" >> "${GITHUB_OUTPUT}"

  bootstrap-evidence:
    name: Bootstrap benchmark evidence
    needs: change-classification
    if: ${{ needs.change-classification.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - name: Build release binary
        run: cargo +1.94.1 build --locked --release -p machine-god-cli
      - name: Collect bootstrap evidence
        run: python3 benchmarks/run.py --binary target/release/machine-god --output benchmarks/results/bootstrap.json
      - name: Validate evidence
        run: >-
          python3 benchmarks/check.py benchmarks/results/bootstrap.json
          --bootstrap
          --expected-git-sha "${{ github.sha }}"
          --binary target/release/machine-god
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-benchmark-${{ github.sha }}
          path: benchmarks/results/bootstrap.json
          if-no-files-found: error
          retention-days: 90

  pinned-upstream-evidence:
    name: Pinned upstream benchmark evidence
    needs: change-classification
    if: ${{ needs.change-classification.outputs.full == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - name: Collect pinned upstream evidence
        run: >-
          python3 benchmarks/with_zig.py
          --cache-root "${RUNNER_TEMP}/machine-god-toolchains"
          --validate-evidence benchmarks/results/upstream-bootstrap.json
          --expected-git-sha "${GITHUB_SHA}"
          --expected-runner-class github-ubuntu-24.04-x86_64
          --fx-binary "${RUNNER_TEMP}/fx-${GITHUB_SHA}/zig-out/bin/fx"
          --machine-god-binary
          "${RUNNER_TEMP}/benchmark-scratch-${GITHUB_SHA}/machine-target/release/machine-god"
          --
          --upstream-dir "${RUNNER_TEMP}/fx-${GITHUB_SHA}"
          --scratch-dir "${RUNNER_TEMP}/benchmark-scratch-${GITHUB_SHA}"
          --output benchmarks/results/upstream-bootstrap.json
          --runner-class github-ubuntu-24.04-x86_64
          --fetch-timeout 300
          --build-timeout 1200
          --sample-timeout 10
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-benchmark-${{ github.sha }}-ubuntu-24.04-x86_64
          path: benchmarks/results/upstream-bootstrap.json
          if-no-files-found: error
          retention-days: 90

  benchmark-gate:
    name: Benchmark gate
    if: ${{ always() }}
    needs:
      - change-classification
      - bootstrap-evidence
      - pinned-upstream-evidence
    runs-on: ubuntu-latest
    steps:
      - name: Require the applicable benchmark evidence
        env:
          CLASSIFICATION_RESULT: ${{ needs.change-classification.result }}
          FULL: ${{ needs.change-classification.outputs.full }}
          DOCS_ONLY: ${{ needs.change-classification.outputs.docs_only }}
          BOOTSTRAP_RESULT: ${{ needs.bootstrap-evidence.result }}
          UPSTREAM_RESULT: ${{ needs.pinned-upstream-evidence.result }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${CLASSIFICATION_RESULT}" != "success" ]]; then
            echo "change classification did not succeed: ${CLASSIFICATION_RESULT}" >&2
            exit 1
          fi

          case "${FULL}:${DOCS_ONLY}" in
            true:false)
              expected="success"
              ;;
            false:true)
              expected="skipped"
              ;;
            *)
              echo "invalid classification full=${FULL} docs_only=${DOCS_ONLY}" >&2
              exit 1
              ;;
          esac

          for result in "${BOOTSTRAP_RESULT}" "${UPSTREAM_RESULT}"
          do
            if [[ "${result}" != "${expected}" ]]; then
              echo "benchmark job was ${result}; expected ${expected}" >&2
              exit 1
            fi
          done

          if [[ "${DOCS_ONLY}" == "true" ]]; then
            echo "Documentation-only change: benchmark jobs were skipped; no artifacts were produced." \
              | tee -a "${GITHUB_STEP_SUMMARY}"
          else
            echo "Full benchmark evidence succeeded."
          fi
