name: Benchmark evidence

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.sha }}
  cancel-in-progress: false

jobs:
  bootstrap-evidence:
    name: Bootstrap benchmark evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - name: Build release binary
        run: cargo +1.94.1 build --locked --release -p machine-god-cli
      - name: Collect bootstrap evidence
        run: python3 benchmarks/run.py --binary target/release/machine-god --output benchmarks/results/bootstrap.json
      - name: Validate evidence
        run: >-
          python3 benchmarks/check.py benchmarks/results/bootstrap.json
          --bootstrap
          --expected-git-sha "${{ github.sha }}"
          --binary target/release/machine-god
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-benchmark-${{ github.sha }}
          path: benchmarks/results/bootstrap.json
          if-no-files-found: error
          retention-days: 90

  pinned-upstream-evidence:
    name: Pinned upstream benchmark evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned Zig
        shell: bash
        env:
          ZIG_VERSION: 0.16.0
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
          ZIG_URL: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
        run: |
          set -euo pipefail

          zig_install_dir="${RUNNER_TEMP}/zig-${ZIG_VERSION}-x86_64-linux"
          zig_archive="${RUNNER_TEMP}/zig-${ZIG_VERSION}-x86_64-linux.tar.xz"
          if [[ -e "${zig_install_dir}" || -L "${zig_install_dir}" ]]; then
            echo "refusing pre-existing Zig install path: ${zig_install_dir}" >&2
            exit 1
          fi
          if [[ -e "${zig_archive}" || -L "${zig_archive}" ]]; then
            echo "refusing pre-existing Zig archive path: ${zig_archive}" >&2
            exit 1
          fi

          mkdir --mode=0700 "${zig_install_dir}"
          curl \
            --fail \
            --show-error \
            --silent \
            --location \
            --proto '=https' \
            --tlsv1.2 \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            --output "${zig_archive}" \
            "${ZIG_URL}"
          printf '%s  %s\n' "${ZIG_SHA256}" "${zig_archive}" \
            | sha256sum --check --strict -
          tar \
            --extract \
            --xz \
            --file "${zig_archive}" \
            --directory "${zig_install_dir}" \
            --strip-components=1
          [[ "$("${zig_install_dir}/zig" version)" == "${ZIG_VERSION}" ]]
          printf '%s\n' "${zig_install_dir}" >> "${GITHUB_PATH}"
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - name: Collect pinned upstream evidence
        run: >-
          python3 benchmarks/upstream.py
          --upstream-dir "${RUNNER_TEMP}/fx-${GITHUB_SHA}"
          --scratch-dir "${RUNNER_TEMP}/benchmark-scratch-${GITHUB_SHA}"
          --output benchmarks/results/upstream-bootstrap.json
          --runner-class github-ubuntu-24.04-x86_64
          --fetch-timeout 300
          --build-timeout 1200
          --sample-timeout 10
      - name: Validate pinned source, SHA, schema, and binaries
        run: >-
          python3 benchmarks/check.py benchmarks/results/upstream-bootstrap.json
          --expected-git-sha "${GITHUB_SHA}"
          --expected-runner-class github-ubuntu-24.04-x86_64
          --fx-binary "${RUNNER_TEMP}/fx-${GITHUB_SHA}/zig-out/bin/fx"
          --machine-god-binary
          "${RUNNER_TEMP}/benchmark-scratch-${GITHUB_SHA}/machine-target/release/machine-god"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-benchmark-${{ github.sha }}-ubuntu-24.04-x86_64
          path: benchmarks/results/upstream-bootstrap.json
          if-no-files-found: error
          retention-days: 90
