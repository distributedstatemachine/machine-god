name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.94.1

jobs:
  change-classification:
    name: Change classification
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.classify.outputs.full }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BEFORE_SHA: ${{ github.event.before || '' }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          CI_DEFAULT_REF: refs/remotes/origin/${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          arguments=(
            --event "${CI_EVENT_NAME}"
            --head "${CI_HEAD_SHA}"
            --default-ref "${CI_DEFAULT_REF}"
            --output "${GITHUB_OUTPUT}"
          )
          if [[ -n "${CI_BEFORE_SHA}" ]]; then
            arguments+=(--before "${CI_BEFORE_SHA}")
          fi
          if [[ -n "${CI_BASE_SHA}" ]]; then
            arguments+=(--base "${CI_BASE_SHA}")
          fi
          python3 scripts/classify_ci_changes.py "${arguments[@]}"

  documentation-policy:
    name: Documentation policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation policy
        run: python3 scripts/check_documentation.py
      - name: Test documentation policy
        run: python3 -m unittest --verbose tests/test_documentation_policy.py

  quality:
    name: Quality and tests
    needs: change-classification
    if: ${{ needs.change-classification.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
      - name: Formatting
        run: cargo +"${RUST_TOOLCHAIN}" fmt --all -- --check
      - name: Clippy
        run: cargo +"${RUST_TOOLCHAIN}" clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo +"${RUST_TOOLCHAIN}" test --locked --workspace
      - name: Documentation tests
        run: cargo +"${RUST_TOOLCHAIN}" test --locked --doc --workspace
      - name: Python tests
        run: |
          python3 - <<'PY'
          import fnmatch
          import os
          import subprocess
          import sys

          excluded_directories = {".bench", ".git", "target"}
          test_files = []
          for root, directories, files in os.walk("."):
              directories[:] = sorted(
                  directory
                  for directory in directories
                  if directory not in excluded_directories
              )
              test_files.extend(
                  os.path.join(root, filename)
                  for filename in sorted(files)
                  if fnmatch.fnmatchcase(filename, "test_*.py")
              )

          if not test_files:
              raise SystemExit("no Python test_*.py files found")

          print("Python test files:", *test_files, sep="\n- ", flush=True)
          subprocess.run(
              [sys.executable, "-m", "unittest", "--verbose", *test_files],
              check=True,
          )
          PY
      - name: Check pinned upstream compatibility inventory
        env:
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          from scripts.generate_compatibility import parse_lock

          lock = parse_lock(Path("benchmarks/upstream.lock"))
          upstream = Path(
              tempfile.mkdtemp(prefix="fx-compatibility-", dir=os.environ["RUNNER_TEMP"])
          )
          git_environment = os.environ.copy()
          for name in ("GH_TOKEN", "GITHUB_TOKEN", "SSH_AUTH_SOCK"):
              git_environment.pop(name, None)
          git_environment["GIT_ASKPASS"] = "/bin/false"
          git_environment["GIT_TERMINAL_PROMPT"] = "0"
          git = [
              "git",
              "-c",
              "credential.helper=",
              "-c",
              "core.askPass=/bin/false",
              "-c",
              "http.extraHeader=",
              "-C",
              str(upstream),
          ]

          subprocess.run(["git", "init", "--quiet", str(upstream)], check=True, env=git_environment)
          subprocess.run(
              [*git, "remote", "add", "origin", lock["repository"]],
              check=True,
              env=git_environment,
          )
          subprocess.run(
              [*git, "fetch", "--depth=1", "origin", lock["commit"]],
              check=True,
              env=git_environment,
          )
          subprocess.run(
              [*git, "checkout", "--quiet", "--detach", lock["commit"]],
              check=True,
              env=git_environment,
          )
          head = subprocess.run(
              [*git, "rev-parse", "HEAD"],
              check=True,
              capture_output=True,
              text=True,
              env=git_environment,
          ).stdout.strip()
          if head != lock["commit"]:
              raise SystemExit(f"upstream checkout is {head}, expected {lock['commit']}")
          subprocess.run(
              [
                  sys.executable,
                  "scripts/generate_compatibility.py",
                  "--upstream",
                  str(upstream),
                  "--check",
              ],
              check=True,
              env=git_environment,
          )
          PY
      - name: Release smoke test
        run: |
          cargo +"${RUST_TOOLCHAIN}" build --locked --release -p machine-god-cli
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import stat
          import subprocess
          import tempfile
          from pathlib import Path

          binary = Path("target/release/machine-god").resolve()
          root = Path(tempfile.mkdtemp(prefix="machine-god-doctor-", dir=os.environ["RUNNER_TEMP"]))
          config_root = root / "missing-config"
          state_root = root / "missing-state"
          home = root / "missing-home"
          environment = os.environ.copy()
          environment.update(
              {
                  "XDG_CONFIG_HOME": str(config_root),
                  "XDG_STATE_HOME": str(state_root),
                  "HOME": str(home),
              }
          )
          environment.pop("VERCEL_OIDC_TOKEN", None)
          environment.pop("AI_GATEWAY_API_KEY", None)

          def run(*arguments: str) -> subprocess.CompletedProcess[str]:
              return subprocess.run(
                  [str(binary), *arguments],
                  check=False,
                  capture_output=True,
                  text=True,
                  env=environment,
              )

          help_results = [
              run("help", "ignored-tail"),
              run("--help", "--json", "ignored-tail"),
              run("-h", "status", "ignored-tail"),
          ]
          if any(result.returncode != 0 or result.stderr for result in help_results):
              raise SystemExit(f"help alias smoke failed: {help_results!r}")
          if len({result.stdout for result in help_results}) != 1:
              raise SystemExit("help aliases were not byte-identical")
          help_text = help_results[0].stdout
          for fragment in (
              "machine-god 0.1.0\n",
              "Commands:\n",
              "  help         Show this help\n",
              "  status       Show configuration and runtime information\n",
              "Options:\n",
          ):
              if fragment not in help_text:
                  raise SystemExit(f"help smoke omitted {fragment!r}")
          if not help_text.endswith("\n") or "\x1b" in help_text:
              raise SystemExit("help framing or plain-output contract changed")

          status_help_expected = (
              "machine-god status\n\n"
              "Show configuration and runtime information\n\n"
              "Usage:\n"
              "  machine-god status [--json]\n\n"
              "Options:\n"
              "  --json  Emit machine-readable JSON instead of text\n"
          )
          for arguments in (
              ("status", "--help"),
              ("status", "unknown", "--json", "-h", "ignored"),
          ):
              result = run(*arguments)
              if result.returncode != 0 or result.stdout != status_help_expected or result.stderr:
                  raise SystemExit(f"status help smoke failed: {result!r}")

          status_human = run("status")
          status_machine = run("status", "--json")
          status_repeated = run("status", "--json", "--json", "--json")
          if any(result.returncode != 0 or result.stderr for result in (status_human, status_machine, status_repeated)):
              raise SystemExit(
                  "status smoke exits: "
                  f"human={status_human.returncode} json={status_machine.returncode} "
                  f"repeated={status_repeated.returncode}"
          )
          workspace = str(Path.cwd().resolve())
          revision_candidate = os.environ.get("MACHINE_GOD_BUILD_REVISION", "")
          revision = (
              revision_candidate
              if 1 <= len(revision_candidate) <= 12
              and all(character in "0123456789abcdefABCDEF" for character in revision_candidate)
              else ""
          )
          expected_status_human = (
              "[status] model=zai/glm-5.2\n"
              "[status] update_channel=stable\n"
              "[status] build_channel=stable\n"
          )
          if revision:
              expected_status_human += f"[status] build_revision={revision}\n"
          expected_status_human += (
              "[status] auth=missing\n"
              "[status] auth_refreshable=false\n"
              "[status] auth_help=Machine God needs access to Vercel AI Gateway. "
              "Set VERCEL_OIDC_TOKEN or AI_GATEWAY_API_KEY.\n"
              "[status] permission_mode=ask\n"
              "[status] sandbox=none\n"
              f"[status] workspace={workspace}\n"
              "[status] history_turns=0\n"
              "[status] session_permission_grants=0\n"
              "[status] agent_step_limit=8\n"
          )
          if status_human.stdout != expected_status_human:
              raise SystemExit(f"unexpected human status output: {status_human.stdout!r}")
          if status_repeated.stdout != status_machine.stdout:
              raise SystemExit("repeated status --json was not idempotent")
          status_report = json.loads(status_machine.stdout)
          if list(status_report) != [
              "kind",
              "model",
              "update_channel",
              "build_channel",
              "build_revision",
              "auth",
              "auth_refreshable",
              "auth_help",
              "permission_mode",
              "sandbox",
              "workspace",
              "history_turns",
              "session_permission_grants",
              "agent_step_limit",
          ]:
              raise SystemExit("status JSON top-level key order changed")
          if status_report != {
              "kind": "status",
              "model": "zai/glm-5.2",
              "update_channel": "stable",
              "build_channel": "stable",
              "build_revision": revision,
              "auth": "missing",
              "auth_refreshable": False,
              "auth_help": (
                  "Machine God needs access to Vercel AI Gateway. "
                  "Set VERCEL_OIDC_TOKEN or AI_GATEWAY_API_KEY."
              ),
              "permission_mode": "ask",
              "sandbox": "none",
              "workspace": workspace,
              "history_turns": 0,
              "session_permission_grants": 0,
              "agent_step_limit": 8,
          }:
              raise SystemExit(f"unexpected status JSON payload: {status_report!r}")
          expected_status_machine = json.dumps(
              status_report,
              ensure_ascii=False,
              separators=(",", ":"),
          ) + "\n"
          if status_machine.stdout != expected_status_machine:
              raise SystemExit("status JSON was not compact or exactly LF-terminated")
          if any(len(result.stdout.encode()) > 65_536 for result in (status_human, status_machine, status_repeated)):
              raise SystemExit("status output bound changed")

          invalid_status_human = run("status", "unknown")
          if (
              invalid_status_human.returncode != 1
              or invalid_status_human.stdout
              or invalid_status_human.stderr != "usage: machine-god status [--json]\n"
          ):
              raise SystemExit(f"unexpected human status parse failure: {invalid_status_human!r}")
          invalid_status_json = run("status", "unknown", "--json")
          if (
              invalid_status_json.returncode != 1
              or invalid_status_json.stderr
              or invalid_status_json.stdout
              != '{"kind":"status","error":"invalid arguments","code":"InvalidLocalSurfaceArgs"}\n'
          ):
              raise SystemExit(f"unexpected JSON status parse failure: {invalid_status_json!r}")
          if any(path.exists() for path in (config_root, state_root, home)):
              raise SystemExit("help/status created an isolated missing root")

          human = run("doctor")
          machine = run("doctor", "--json")
          if human.returncode != 0 or machine.returncode != 0:
              raise SystemExit(f"doctor smoke exits: human={human.returncode} json={machine.returncode}")
          if human.stderr or machine.stderr:
              raise SystemExit("doctor smoke wrote unexpected stderr")

          expected_lines = [
              "[doctor] ok=1 warn=2 fail=1",
              "[warn] config: configuration file is missing; using built-in defaults",
              "[fail] credential: no AI Gateway credential is configured",
              "[warn] state: state directory is not initialized",
              "[ok] platform: native host platform is supported",
          ]
          if human.stdout != "\n".join(expected_lines) + "\n":
              raise SystemExit(f"unexpected human doctor output: {human.stdout!r}")
          if len(human.stdout.encode()) > 4096:
              raise SystemExit("doctor human output bound changed")

          report = json.loads(machine.stdout)
          if list(report) != ["kind", "ok_count", "warn_count", "fail_count", "checks"]:
              raise SystemExit("doctor JSON top-level key order changed")
          if report["kind"] != "doctor" or (report["ok_count"], report["warn_count"], report["fail_count"]) != (1, 2, 1):
              raise SystemExit(f"unexpected doctor counts: {report!r}")
          checks = report["checks"]
          if len(checks) != 4 or sum(report[name] for name in ("ok_count", "warn_count", "fail_count")) != 4:
              raise SystemExit("doctor count/check consistency failed")
          for check, line in zip(checks, expected_lines[1:], strict=True):
              if list(check) != ["name", "status", "detail"]:
                  raise SystemExit("doctor JSON check key order changed")
              if line != f"[{check['status']}] {check['name']}: {check['detail']}":
                  raise SystemExit("doctor human/JSON check mismatch")
          if not machine.stdout.endswith("\n") or len(machine.stdout.encode()) > 4096:
              raise SystemExit("doctor JSON framing or output bound changed")
          if any(path.exists() for path in (config_root, state_root, home)):
              raise SystemExit("doctor created an isolated missing root")

          workspace_smoke_root = Path(
              tempfile.mkdtemp(prefix="machine-god-workspace-", dir=os.environ["RUNNER_TEMP"])
          )
          workspace_root = workspace_smoke_root / "primary workspace"
          workspace_root.mkdir()
          workspace_config_root = workspace_smoke_root / "missing-config"
          workspace_state_root = workspace_smoke_root / "missing-state"
          workspace_home = workspace_smoke_root / "missing-home"
          workspace_environment = os.environ.copy()
          workspace_environment.update(
              {
                  "XDG_CONFIG_HOME": str(workspace_config_root),
                  "XDG_STATE_HOME": str(workspace_state_root),
                  "HOME": str(workspace_home),
              }
          )
          workspace_environment.pop("VERCEL_OIDC_TOKEN", None)
          workspace_environment.pop("AI_GATEWAY_API_KEY", None)

          def run_workspace(*arguments: str) -> subprocess.CompletedProcess[str]:
              return subprocess.run(
                  [str(binary), *arguments],
                  check=False,
                  capture_output=True,
                  text=True,
                  cwd=workspace_root,
                  env=workspace_environment,
              )

          workspace_human_default = run_workspace("workspace")
          workspace_human_list = run_workspace("workspace", "list")
          workspace_json_default = run_workspace("workspace", "--json")
          workspace_json_list = run_workspace("workspace", "list", "--json")
          workspace_results = (
              workspace_human_default,
              workspace_human_list,
              workspace_json_default,
              workspace_json_list,
          )
          if any(result.returncode != 0 for result in workspace_results):
              raise SystemExit(
                  "workspace smoke exits: "
                  + ", ".join(str(result.returncode) for result in workspace_results)
              )
          if any(result.stderr for result in workspace_results):
              raise SystemExit("workspace smoke wrote unexpected stderr")

          encoded_workspace_path = json.dumps(str(workspace_root), ensure_ascii=False)
          expected_workspace_human = (
              f"[workspace] primary={encoded_workspace_path}\n"
              "[workspace] additional_directories=unsupported\n"
          )
          if workspace_human_default.stdout != expected_workspace_human:
              raise SystemExit(
                  f"unexpected default human workspace output: {workspace_human_default.stdout!r}"
              )
          if workspace_human_list.stdout != expected_workspace_human:
              raise SystemExit(
                  f"unexpected explicit-list workspace output: {workspace_human_list.stdout!r}"
              )

          expected_workspace_json = (
              json.dumps(
                  {
                      "kind": "workspace",
                      "action": "list",
                      "primary_directory": str(workspace_root),
                      "additional_directories_supported": False,
                      "additional_directories": [],
                  },
                  ensure_ascii=False,
                  separators=(",", ":"),
              )
              + "\n"
          )
          if workspace_json_default.stdout != expected_workspace_json:
              raise SystemExit(
                  f"unexpected default JSON workspace output: {workspace_json_default.stdout!r}"
              )
          if workspace_json_list.stdout != expected_workspace_json:
              raise SystemExit(
                  f"unexpected explicit-list JSON workspace output: {workspace_json_list.stdout!r}"
              )
          workspace_report = json.loads(workspace_json_default.stdout)
          if list(workspace_report) != [
              "kind",
              "action",
              "primary_directory",
              "additional_directories_supported",
              "additional_directories",
          ]:
              raise SystemExit("workspace JSON top-level key order changed")
          if any(len(result.stdout.encode()) > 32768 for result in workspace_results):
              raise SystemExit("workspace success output bound changed")
          if list(workspace_root.iterdir()):
              raise SystemExit("workspace inspection changed its dedicated current directory")
          if any(
              path.exists()
              for path in (workspace_config_root, workspace_state_root, workspace_home)
          ):
              raise SystemExit("workspace inspection created an isolated missing root")

          sessions_root = Path(
              tempfile.mkdtemp(prefix="machine-god-sessions-", dir=os.environ["RUNNER_TEMP"])
          )
          sessions_config_root = sessions_root / "missing-config"
          sessions_state_root = sessions_root / "missing-state"
          sessions_home = sessions_root / "missing-home"
          sessions_environment = os.environ.copy()
          sessions_environment.update(
              {
                  "XDG_CONFIG_HOME": str(sessions_config_root),
                  "XDG_STATE_HOME": str(sessions_state_root),
                  "HOME": str(sessions_home),
              }
          )
          sessions_environment.pop("VERCEL_OIDC_TOKEN", None)
          sessions_environment.pop("AI_GATEWAY_API_KEY", None)

          def run_sessions(*arguments: str) -> subprocess.CompletedProcess[str]:
              return subprocess.run(
                  [str(binary), *arguments],
                  check=False,
                  capture_output=True,
                  text=True,
                  env=sessions_environment,
              )

          sessions_human = run_sessions("sessions")
          sessions_machine = run_sessions("sessions", "--json")
          if sessions_human.returncode != 0 or sessions_machine.returncode != 0:
              raise SystemExit(
                  "sessions smoke exits: "
                  f"human={sessions_human.returncode} json={sessions_machine.returncode}"
              )
          if sessions_human.stderr or sessions_machine.stderr:
              raise SystemExit("sessions smoke wrote unexpected stderr")
          if sessions_human.stdout != "[sessions] no saved sessions\n":
              raise SystemExit(f"unexpected human sessions output: {sessions_human.stdout!r}")
          sessions_report = json.loads(sessions_machine.stdout)
          if list(sessions_report) != ["kind", "count", "truncated", "sessions"]:
              raise SystemExit("sessions JSON top-level key order changed")
          if sessions_report != {
              "kind": "sessions",
              "count": 0,
              "truncated": False,
              "sessions": [],
          }:
              raise SystemExit(f"unexpected sessions JSON report: {sessions_report!r}")
          if not sessions_machine.stdout.endswith("\n"):
              raise SystemExit("sessions JSON lost its final LF")
          if any(
              path.exists()
              for path in (sessions_config_root, sessions_state_root, sessions_home)
          ):
              raise SystemExit("sessions created an isolated missing root")

          session_root = Path(
              tempfile.mkdtemp(prefix="machine-god-session-", dir=os.environ["RUNNER_TEMP"])
          )
          session_config_root = session_root / "missing-config"
          session_state_root = session_root / "state"
          session_store_root = session_state_root / "machine-god"
          session_home = session_root / "missing-home"
          session_state_root.mkdir(mode=0o700)
          session_store_root.mkdir(mode=0o700)
          session_id = "ci-session"
          session_incarnation = "ci-incarnation"
          session_record = {
              "schema_version": 1,
              "record": {
                  "id": session_id,
                  "incarnation_id": session_incarnation,
                  "revision": 7,
                  "next_turn_sequence": 4,
                  "messages": [
                      {"role": "user", "content": [{"type": "text", "text": "private"}]},
                  ],
                  "metadata": {"private-key": "private-value"},
              },
          }
          session_bytes = json.dumps(
              session_record, separators=(",", ":"), ensure_ascii=True
          ).encode()
          session_digest = hashlib.sha256(
              b"machine-god:file-session:v1:" + session_id.encode()
          ).hexdigest()
          session_data = session_store_root / f"session-{session_digest}.json"
          session_lock = session_store_root / f"session-{session_digest}.lock"
          session_data.write_bytes(session_bytes)
          session_data.chmod(0o600)
          session_environment = os.environ.copy()
          session_environment.update(
              {
                  "XDG_CONFIG_HOME": str(session_config_root),
                  "XDG_STATE_HOME": str(session_state_root),
                  "HOME": str(session_home),
                  "VERCEL_OIDC_TOKEN": "ignored invalid credential",
                  "AI_GATEWAY_API_KEY": "ignored lower credential",
              }
          )

          def run_session(*arguments: str) -> subprocess.CompletedProcess[str]:
              return subprocess.run(
                  [str(binary), *arguments],
                  check=False,
                  capture_output=True,
                  text=True,
                  env=session_environment,
              )

          session_human = run_session("session", session_id)
          session_machine = run_session("session", session_id, "--json")
          session_missing = run_session("session", "missing-session")
          if session_human.returncode != 0 or session_machine.returncode != 0:
              raise SystemExit(
                  "session smoke exits: "
                  f"human={session_human.returncode} json={session_machine.returncode}"
              )
          if session_human.stderr or session_machine.stderr:
              raise SystemExit("session success smoke wrote unexpected stderr")
          expected_session_human = (
              "[session] ci-session\n"
              " - incarnation_id: ci-incarnation\n"
              " - revision: 7\n"
              " - next_turn_sequence: 4\n"
              " - message_count: 1\n"
              " - metadata_entry_count: 1\n"
          )
          if session_human.stdout != expected_session_human:
              raise SystemExit(f"unexpected human session output: {session_human.stdout!r}")
          expected_session_json = (
              '{"kind":"session","id":"ci-session",'
              '"incarnation_id":"ci-incarnation","revision":7,'
              '"next_turn_sequence":4,"message_count":1,'
              '"metadata_entry_count":1}\n'
          )
          if session_machine.stdout != expected_session_json:
              raise SystemExit(f"unexpected JSON session output: {session_machine.stdout!r}")
          session_report = json.loads(session_machine.stdout)
          if list(session_report) != [
              "kind",
              "id",
              "incarnation_id",
              "revision",
              "next_turn_sequence",
              "message_count",
              "metadata_entry_count",
          ]:
              raise SystemExit("session JSON top-level key order changed")
          if any(len(output.stdout.encode()) > 4096 for output in (session_human, session_machine)):
              raise SystemExit("session success output bound changed")
          if session_missing.returncode != 1 or session_missing.stdout:
              raise SystemExit(f"unexpected missing session exit/output: {session_missing!r}")
          if session_missing.stderr != (
              "machine-god session: could not inspect session: NotFound\n"
          ):
              raise SystemExit(f"unexpected missing session error: {session_missing.stderr!r}")
          if session_data.read_bytes() != session_bytes:
              raise SystemExit("session inspection rewrote the record")
          if not session_lock.is_file() or stat.S_IMODE(session_lock.stat().st_mode) != 0o600:
              raise SystemExit("session inspection did not create an exact private lock sidecar")
          if session_config_root.exists() or session_home.exists():
              raise SystemExit("session inspection touched an unrelated root")
          PY

  security:
    name: Dependency policy and vulnerability audit
    needs: change-classification
    if: ${{ needs.change-classification.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Install exact cargo-deny
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}
        env:
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/security-tools
          CARGO_TARGET_DIR: ${{ runner.temp }}/security-tool-build
        run: cargo +"${RUST_TOOLCHAIN}" install cargo-deny --locked --version 0.20.2
      - name: Install exact cargo-audit
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}
        env:
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/security-tools
          CARGO_TARGET_DIR: ${{ runner.temp }}/security-tool-build
        run: cargo +"${RUST_TOOLCHAIN}" install cargo-audit --locked --version 0.22.2
      - name: Check dependency policy
        if: ${{ !cancelled() }}
        run: '"${RUNNER_TEMP}/security-tools/bin/cargo-deny" check'
      - name: Audit lockfile
        if: ${{ !cancelled() }}
        run: '"${RUNNER_TEMP}/security-tools/bin/cargo-audit" audit'

  native-target-tests:
    name: Native tests (${{ matrix.target }})
    needs: change-classification
    if: ${{ needs.change-classification.outputs.full == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust target
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "${{ matrix.target }}"
      - name: Test target natively
        run: cargo +"${RUST_TOOLCHAIN}" test --locked --workspace --all-targets --all-features --target "${{ matrix.target }}"

  unsupported-native-tools:
    name: Unsupported native tools (FreeBSD)
    needs: change-classification
    if: ${{ needs.change-classification.outputs.full == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust target and Clippy
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --target x86_64-unknown-freebsd
      - name: Compile unsupported-platform native surfaces
        run: cargo +"${RUST_TOOLCHAIN}" clippy --locked -p machine-god-native --lib --test install_skill_unsupported --test memory_unsupported --test semantic_search_unsupported --test vision_unsupported --no-default-features --features vision --target x86_64-unknown-freebsd -- -D warnings

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - change-classification
      - documentation-policy
      - quality
      - security
      - native-target-tests
      - unsupported-native-tools
    runs-on: ubuntu-latest
    steps:
      - name: Require the applicable checks
        env:
          CLASSIFICATION_RESULT: ${{ needs.change-classification.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation-policy.result }}
          FULL: ${{ needs.change-classification.outputs.full }}
          DOCS_ONLY: ${{ needs.change-classification.outputs.docs_only }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          NATIVE_RESULT: ${{ needs.native-target-tests.result }}
          FREEBSD_RESULT: ${{ needs.unsupported-native-tools.result }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${CLASSIFICATION_RESULT}" != "success" ]]; then
            echo "change classification did not succeed: ${CLASSIFICATION_RESULT}" >&2
            exit 1
          fi
          if [[ "${DOCUMENTATION_RESULT}" != "success" ]]; then
            echo "documentation policy did not succeed: ${DOCUMENTATION_RESULT}" >&2
            exit 1
          fi

          case "${FULL}:${DOCS_ONLY}" in
            true:false)
              expected="success"
              ;;
            false:true)
              expected="skipped"
              ;;
            *)
              echo "invalid classification full=${FULL} docs_only=${DOCS_ONLY}" >&2
              exit 1
              ;;
          esac

          for result in \
            "${QUALITY_RESULT}" \
            "${SECURITY_RESULT}" \
            "${NATIVE_RESULT}" \
            "${FREEBSD_RESULT}"
          do
            if [[ "${result}" != "${expected}" ]]; then
              echo "heavy CI job was ${result}; expected ${expected}" >&2
              exit 1
            fi
          done
