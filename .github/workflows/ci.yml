name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.94.1

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
      - name: Formatting
        run: cargo +${RUST_TOOLCHAIN} fmt --all -- --check
      - name: Clippy
        run: cargo +${RUST_TOOLCHAIN} clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo +${RUST_TOOLCHAIN} test --locked --workspace
      - name: Documentation tests
        run: cargo +${RUST_TOOLCHAIN} test --locked --doc --workspace
      - name: Benchmark harness tests
        run: python3 -m unittest benchmarks/test_benchmarks.py -v
      - name: Release smoke test
        run: |
          cargo +${RUST_TOOLCHAIN} build --locked --release -p machine-god-cli
          ./target/release/machine-god

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install exact cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Check dependency policy
        run: cargo deny check

  vulnerability-audit:
    name: Vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install exact cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit lockfile
        run: cargo audit

  target-check:
    name: Target check (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install exact Rust target
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "${{ matrix.target }}"
      - name: Check target
        run: cargo +${RUST_TOOLCHAIN} check --locked --workspace --all-targets --all-features --target "${{ matrix.target }}"
