name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.94.1

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
      - name: Formatting
        run: cargo +"${RUST_TOOLCHAIN}" fmt --all -- --check
      - name: Clippy
        run: cargo +"${RUST_TOOLCHAIN}" clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo +"${RUST_TOOLCHAIN}" test --locked --workspace
      - name: Documentation tests
        run: cargo +"${RUST_TOOLCHAIN}" test --locked --doc --workspace
      - name: Python tests
        run: |
          python3 - <<'PY'
          import fnmatch
          import os
          import subprocess
          import sys

          excluded_directories = {".bench", ".git", "target"}
          test_files = []
          for root, directories, files in os.walk("."):
              directories[:] = sorted(
                  directory
                  for directory in directories
                  if directory not in excluded_directories
              )
              test_files.extend(
                  os.path.join(root, filename)
                  for filename in sorted(files)
                  if fnmatch.fnmatchcase(filename, "test_*.py")
              )

          if not test_files:
              raise SystemExit("no Python test_*.py files found")

          print("Python test files:", *test_files, sep="\n- ", flush=True)
          subprocess.run(
              [sys.executable, "-m", "unittest", "--verbose", *test_files],
              check=True,
          )
          PY
      - name: Check pinned upstream compatibility inventory
        env:
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          from scripts.generate_compatibility import parse_lock

          lock = parse_lock(Path("benchmarks/upstream.lock"))
          upstream = Path(
              tempfile.mkdtemp(prefix="fx-compatibility-", dir=os.environ["RUNNER_TEMP"])
          )
          git_environment = os.environ.copy()
          for name in ("GH_TOKEN", "GITHUB_TOKEN", "SSH_AUTH_SOCK"):
              git_environment.pop(name, None)
          git_environment["GIT_ASKPASS"] = "/bin/false"
          git_environment["GIT_TERMINAL_PROMPT"] = "0"
          git = [
              "git",
              "-c",
              "credential.helper=",
              "-c",
              "core.askPass=/bin/false",
              "-c",
              "http.extraHeader=",
              "-C",
              str(upstream),
          ]

          subprocess.run(["git", "init", "--quiet", str(upstream)], check=True, env=git_environment)
          subprocess.run(
              [*git, "remote", "add", "origin", lock["repository"]],
              check=True,
              env=git_environment,
          )
          subprocess.run(
              [*git, "fetch", "--depth=1", "origin", lock["commit"]],
              check=True,
              env=git_environment,
          )
          subprocess.run(
              [*git, "checkout", "--quiet", "--detach", lock["commit"]],
              check=True,
              env=git_environment,
          )
          head = subprocess.run(
              [*git, "rev-parse", "HEAD"],
              check=True,
              capture_output=True,
              text=True,
              env=git_environment,
          ).stdout.strip()
          if head != lock["commit"]:
              raise SystemExit(f"upstream checkout is {head}, expected {lock['commit']}")
          subprocess.run(
              [
                  sys.executable,
                  "scripts/generate_compatibility.py",
                  "--upstream",
                  str(upstream),
                  "--check",
              ],
              check=True,
              env=git_environment,
          )
          PY
      - name: Release smoke test
        run: |
          cargo +"${RUST_TOOLCHAIN}" build --locked --release -p machine-god-cli
          ./target/release/machine-god

  security:
    name: Dependency policy and vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Install exact cargo-deny
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}
        env:
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/security-tools
          CARGO_TARGET_DIR: ${{ runner.temp }}/security-tool-build
        run: cargo +"${RUST_TOOLCHAIN}" install cargo-deny --locked --version 0.20.2
      - name: Install exact cargo-audit
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}
        env:
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/security-tools
          CARGO_TARGET_DIR: ${{ runner.temp }}/security-tool-build
        run: cargo +"${RUST_TOOLCHAIN}" install cargo-audit --locked --version 0.22.2
      - name: Check dependency policy
        if: ${{ !cancelled() }}
        run: '"${RUNNER_TEMP}/security-tools/bin/cargo-deny" check'
      - name: Audit lockfile
        if: ${{ !cancelled() }}
        run: '"${RUNNER_TEMP}/security-tools/bin/cargo-audit" audit'

  native-target-tests:
    name: Native tests (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust target
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "${{ matrix.target }}"
      - name: Test target natively
        run: cargo +"${RUST_TOOLCHAIN}" test --locked --workspace --all-targets --all-features --target "${{ matrix.target }}"
