name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.94.1

jobs:
  change-classification:
    name: Change classification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      documentation: ${{ steps.route.outputs.documentation }}
      core: ${{ steps.route.outputs.core }}
      testkit: ${{ steps.route.outputs.testkit }}
      native: ${{ steps.route.outputs.native }}
      cli: ${{ steps.route.outputs.cli }}
      format: ${{ steps.route.outputs.format }}
      quality: ${{ steps.route.outputs.quality }}
      full_workspace: ${{ steps.route.outputs.full_workspace }}
      benchmark_tests: ${{ steps.route.outputs.benchmark_tests }}
      compatibility_tests: ${{ steps.route.outputs.compatibility_tests }}
      ci_classifier_tests: ${{ steps.route.outputs.ci_classifier_tests }}
      native_manifest_tests: ${{ steps.route.outputs.native_manifest_tests }}
      provision_zig_tests: ${{ steps.route.outputs.provision_zig_tests }}
      compatibility: ${{ steps.route.outputs.compatibility }}
      release_smoke: ${{ steps.route.outputs.release_smoke }}
      dependency_audit: ${{ steps.route.outputs.dependency_audit }}
      native_matrix: ${{ steps.route.outputs.native_matrix }}
      unsupported: ${{ steps.route.outputs.unsupported }}
      test_support: ${{ steps.route.outputs.test_support }}
      core_api_docs: ${{ steps.route.outputs.core_api_docs }}
      testkit_docs: ${{ steps.route.outputs.testkit_docs }}
      compatibility_docs: ${{ steps.route.outputs.compatibility_docs }}
      vision_docs: ${{ steps.route.outputs.vision_docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Require visible submodule changes
        shell: bash
        run: |
          set -euo pipefail

          reject_hidden_gitlinks() {
            local label="${1}"
            shift
            local status=0
            git config "${@}" \
              --get-regexp '^(diff\.ignoresubmodules|submodule\..*\.ignore)$' \
              >/dev/null || status=$?
            case "${status}" in
              0)
                echo "::error::${label} must not hide submodule changes"
                exit 1
                ;;
              1) ;;
              *)
                echo "::error::${label} must be valid Git config"
                exit 1
                ;;
            esac
          }

          reject_hidden_gitlinks "effective Git config"
          if [[ -e .gitmodules || -L .gitmodules ]]; then
            if [[ -L .gitmodules || ! -f .gitmodules ]]; then
              echo "::error::.gitmodules must be a regular file"
              exit 1
            fi
            reject_hidden_gitlinks ".gitmodules" --file .gitmodules
          fi
      - name: Classify changed paths
        id: paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ''
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || github.sha }}
          ref: ${{ github.sha }}
          predicate-quantifier: some-with-excludes
          filters: |
            documentation:
              - 'AGENTS.md'
              - 'README.md'
              - 'docs/**/*.md'
            non_documentation:
              - '**'
              - '!AGENTS.md'
              - '!README.md'
              - '!docs/**/*.md'
            unclassified:
              - '**'
              - '!AGENTS.md'
              - '!README.md'
              - '!docs/**/*.md'
              - '!.github/workflows/**'
              - '!.gitignore'
              - '!Cargo.lock'
              - '!Cargo.toml'
              - '!LICENSE'
              - '!NOTICE'
              - '!benchmarks/**'
              - '!compatibility/**'
              - '!crates/machine-god-cli/**'
              - '!crates/machine-god-core/**'
              - '!crates/machine-god-native/**'
              - '!crates/machine-god-testkit/**'
              - '!deny.toml'
              - '!rust-toolchain.toml'
              - '!rustfmt.toml'
              - '!test-support/reentrant-waker/**'
              - '!benchmarks/test_benchmarks.py'
              - '!compatibility/test_generate_compatibility.py'
              - '!scripts/check_documentation.py'
              - '!scripts/generate_compatibility.py'
              - '!scripts/provision_zig.py'
              - '!tests/test_ci_change_classification.py'
              - '!tests/test_documentation_policy.py'
              - '!tests/test_native_manifest.py'
              - '!tests/test_provision_zig.py'
            ci_infrastructure:
              - '.github/workflows/**'
              - 'tests/test_ci_change_classification.py'
            rust_global:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
            rust_format:
              - 'rustfmt.toml'
            core_any:
              - 'crates/machine-god-core/**'
            core_source:
              - 'crates/machine-god-core/**'
              - '!crates/machine-god-core/benches/**'
              - '!crates/machine-god-core/examples/**'
              - '!crates/machine-god-core/tests/**'
            testkit_any:
              - 'crates/machine-god-testkit/**'
            testkit_source:
              - 'crates/machine-god-testkit/**'
              - '!crates/machine-god-testkit/benches/**'
              - '!crates/machine-god-testkit/examples/**'
              - '!crates/machine-god-testkit/tests/**'
            native_any:
              - 'crates/machine-god-native/**'
            native_source:
              - 'crates/machine-god-native/**'
              - '!crates/machine-god-native/benches/**'
              - '!crates/machine-god-native/examples/**'
              - '!crates/machine-god-native/tests/**'
            cli_any:
              - 'crates/machine-god-cli/**'
            cli_source:
              - 'crates/machine-god-cli/**'
              - '!crates/machine-god-cli/benches/**'
              - '!crates/machine-god-cli/examples/**'
              - '!crates/machine-god-cli/tests/**'
            test_support:
              - 'test-support/reentrant-waker/**'
            benchmark_test_inputs:
              - 'benchmarks/**'
            compatibility_test_inputs:
              - 'compatibility/**'
              - 'benchmarks/upstream.lock'
              - 'scripts/generate_compatibility.py'
            ci_classifier_test_inputs:
              - '.github/workflows/**'
              - 'tests/test_ci_change_classification.py'
            native_manifest_test_inputs:
              - '.github/workflows/ci.yml'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/machine-god-cli/Cargo.toml'
              - 'crates/machine-god-native/Cargo.toml'
              - 'crates/machine-god-native/examples/ask_user_question_release_panic_probe.rs'
              - 'crates/machine-god-native/src/ai_gateway_model_catalog_http.rs'
              - 'crates/machine-god-native/src/lib.rs'
              - 'crates/machine-god-native/src/vision_portable.rs'
              - 'crates/machine-god-native/src/web_search.rs'
              - 'docs/vision.md'
              - 'rust-toolchain.toml'
              - 'tests/test_native_manifest.py'
            provision_zig_test_inputs:
              - 'benchmarks/with_zig.py'
              - 'scripts/provision_zig.py'
              - 'tests/test_provision_zig.py'
            compatibility_inputs:
              - 'compatibility/**'
              - 'benchmarks/upstream.lock'
              - 'scripts/generate_compatibility.py'
            dependency_inputs:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/*/Cargo.toml'
              - 'deny.toml'
            documentation_policy:
              - 'AGENTS.md'
              - 'README.md'
              - 'docs/**/*.md'
              - 'scripts/check_documentation.py'
              - 'tests/test_documentation_policy.py'
            core_api_docs:
              - 'docs/core-api.md'
            testkit_docs:
              - 'docs/testkit.md'
            compatibility_docs:
              - 'docs/compatibility.md'
            vision_docs:
              - 'docs/vision.md'
      - name: Select the applicable gate
        id: route
        env:
          DOCUMENTATION: ${{ steps.paths.outputs.documentation }}
          NON_DOCUMENTATION: ${{ steps.paths.outputs.non_documentation }}
          UNCLASSIFIED: ${{ steps.paths.outputs.unclassified }}
          CI_INFRASTRUCTURE: ${{ steps.paths.outputs.ci_infrastructure }}
          RUST_GLOBAL: ${{ steps.paths.outputs.rust_global }}
          RUST_FORMAT: ${{ steps.paths.outputs.rust_format }}
          CORE_ANY: ${{ steps.paths.outputs.core_any }}
          CORE_SOURCE: ${{ steps.paths.outputs.core_source }}
          TESTKIT_ANY: ${{ steps.paths.outputs.testkit_any }}
          TESTKIT_SOURCE: ${{ steps.paths.outputs.testkit_source }}
          NATIVE_ANY: ${{ steps.paths.outputs.native_any }}
          NATIVE_SOURCE: ${{ steps.paths.outputs.native_source }}
          CLI_ANY: ${{ steps.paths.outputs.cli_any }}
          CLI_SOURCE: ${{ steps.paths.outputs.cli_source }}
          TEST_SUPPORT: ${{ steps.paths.outputs.test_support }}
          BENCHMARK_TEST_INPUTS: ${{ steps.paths.outputs.benchmark_test_inputs }}
          COMPATIBILITY_TEST_INPUTS: ${{ steps.paths.outputs.compatibility_test_inputs }}
          CI_CLASSIFIER_TEST_INPUTS: ${{ steps.paths.outputs.ci_classifier_test_inputs }}
          NATIVE_MANIFEST_TEST_INPUTS: ${{ steps.paths.outputs.native_manifest_test_inputs }}
          PROVISION_ZIG_TEST_INPUTS: ${{ steps.paths.outputs.provision_zig_test_inputs }}
          COMPATIBILITY_INPUTS: ${{ steps.paths.outputs.compatibility_inputs }}
          DEPENDENCY_INPUTS: ${{ steps.paths.outputs.dependency_inputs }}
          DOCUMENTATION_POLICY: ${{ steps.paths.outputs.documentation_policy }}
          CORE_API_DOCS: ${{ steps.paths.outputs.core_api_docs }}
          TESTKIT_DOCS: ${{ steps.paths.outputs.testkit_docs }}
          COMPATIBILITY_DOCS: ${{ steps.paths.outputs.compatibility_docs }}
          VISION_DOCS: ${{ steps.paths.outputs.vision_docs }}
        shell: bash
        run: |
          set -euo pipefail

          documentation=true
          core=true
          testkit=true
          native=true
          cli=true
          format=true
          quality=true
          full_workspace=true
          benchmark_tests=true
          compatibility_tests=true
          ci_classifier_tests=true
          native_manifest_tests=true
          provision_zig_tests=true
          compatibility=true
          release_smoke=true
          dependency_audit=true
          native_matrix=true
          unsupported=true
          test_support=true
          core_api_docs=true
          testkit_docs=true
          compatibility_docs=true
          vision_docs=true

          valid=true
          for value in \
            "${DOCUMENTATION}" \
            "${NON_DOCUMENTATION}" \
            "${UNCLASSIFIED}" \
            "${CI_INFRASTRUCTURE}" \
            "${RUST_GLOBAL}" \
            "${RUST_FORMAT}" \
            "${CORE_ANY}" \
            "${CORE_SOURCE}" \
            "${TESTKIT_ANY}" \
            "${TESTKIT_SOURCE}" \
            "${NATIVE_ANY}" \
            "${NATIVE_SOURCE}" \
            "${CLI_ANY}" \
            "${CLI_SOURCE}" \
            "${TEST_SUPPORT}" \
            "${BENCHMARK_TEST_INPUTS}" \
            "${COMPATIBILITY_TEST_INPUTS}" \
            "${CI_CLASSIFIER_TEST_INPUTS}" \
            "${NATIVE_MANIFEST_TEST_INPUTS}" \
            "${PROVISION_ZIG_TEST_INPUTS}" \
            "${COMPATIBILITY_INPUTS}" \
            "${DEPENDENCY_INPUTS}" \
            "${DOCUMENTATION_POLICY}" \
            "${CORE_API_DOCS}" \
            "${TESTKIT_DOCS}" \
            "${COMPATIBILITY_DOCS}" \
            "${VISION_DOCS}"
          do
            if [[ "${value}" != "true" && "${value}" != "false" ]]; then
              valid=false
            fi
          done

          if [[ "${valid}" == "true" && "${UNCLASSIFIED}" == "true" ]]; then
            echo "unclassified non-documentation path" >&2
            exit 1
          fi

          if [[ "${valid}" == "true" ]]; then
            documentation="${DOCUMENTATION_POLICY}"
            core=false
            testkit=false
            native=false
            cli=false
            format=false
            full_workspace=false
            benchmark_tests=false
            compatibility_tests=false
            ci_classifier_tests=false
            native_manifest_tests=false
            provision_zig_tests=false
            compatibility=false
            release_smoke=false
            dependency_audit=false
            test_support=false

            if [[ "${NON_DOCUMENTATION}" == "true" ]]; then
              format="${RUST_FORMAT}"
              benchmark_tests="${BENCHMARK_TEST_INPUTS}"
              compatibility_tests="${COMPATIBILITY_TEST_INPUTS}"
              ci_classifier_tests="${CI_CLASSIFIER_TEST_INPUTS}"
              native_manifest_tests="${NATIVE_MANIFEST_TEST_INPUTS}"
              provision_zig_tests="${PROVISION_ZIG_TEST_INPUTS}"
              test_support="${TEST_SUPPORT}"
            fi

            fallback=false
            if [[ "${CI_INFRASTRUCTURE}" == "true" ]]; then
              fallback=true
            fi

            if [[ "${fallback}" == "true" ]]; then
              documentation=true
              core=true
              testkit=true
              native=true
              cli=true
              format=true
              full_workspace=true
              benchmark_tests=true
              compatibility_tests=true
              ci_classifier_tests=true
              native_manifest_tests=true
              provision_zig_tests=true
              compatibility=true
              release_smoke=true
              dependency_audit=true
              test_support=true
              core_api_docs=true
              testkit_docs=true
              compatibility_docs=true
              vision_docs=true
            else
              if [[ "${RUST_GLOBAL}" == "true" || "${CORE_ANY}" == "true" || "${TEST_SUPPORT}" == "true" ]]; then
                core=true
              fi
              if [[ "${RUST_GLOBAL}" == "true" ]]; then
                full_workspace=true
              fi
              if [[ "${RUST_GLOBAL}" == "true" || "${TESTKIT_ANY}" == "true" || "${CORE_SOURCE}" == "true" ]]; then
                testkit=true
              fi
              if [[ "${RUST_GLOBAL}" == "true" || "${NATIVE_ANY}" == "true" || "${CORE_SOURCE}" == "true" || "${TESTKIT_SOURCE}" == "true" || "${TEST_SUPPORT}" == "true" ]]; then
                native=true
              fi
              if [[ "${RUST_GLOBAL}" == "true" || "${CLI_ANY}" == "true" || "${CORE_SOURCE}" == "true" || "${NATIVE_SOURCE}" == "true" ]]; then
                cli=true
              fi
              if [[ "${COMPATIBILITY_INPUTS}" == "true" ]]; then
                compatibility=true
              fi
              if [[ "${RUST_GLOBAL}" == "true" || "${CORE_SOURCE}" == "true" || "${NATIVE_SOURCE}" == "true" || "${CLI_SOURCE}" == "true" ]]; then
                release_smoke=true
              fi
              dependency_audit="${DEPENDENCY_INPUTS}"
              core_api_docs="${CORE_API_DOCS}"
              testkit_docs="${TESTKIT_DOCS}"
              compatibility_docs="${COMPATIBILITY_DOCS}"
              vision_docs="${VISION_DOCS}"
            fi
          fi

          quality=false
          native_matrix=false
          unsupported=false
          if [[ "${core}" == "true" || "${testkit}" == "true" || "${native}" == "true" || "${cli}" == "true" || "${format}" == "true" || "${full_workspace}" == "true" || "${benchmark_tests}" == "true" || "${compatibility_tests}" == "true" || "${ci_classifier_tests}" == "true" || "${native_manifest_tests}" == "true" || "${provision_zig_tests}" == "true" || "${compatibility}" == "true" || "${release_smoke}" == "true" ]]; then
            quality=true
          fi
          if [[ "${core}" == "true" || "${testkit}" == "true" || "${native}" == "true" || "${cli}" == "true" ]]; then
            native_matrix=true
          fi
          if [[ "${native}" == "true" ]]; then
            unsupported=true
          fi

          # shellcheck disable=SC2129
          echo "documentation=${documentation}" >> "${GITHUB_OUTPUT}"
          echo "core=${core}" >> "${GITHUB_OUTPUT}"
          echo "testkit=${testkit}" >> "${GITHUB_OUTPUT}"
          echo "native=${native}" >> "${GITHUB_OUTPUT}"
          echo "cli=${cli}" >> "${GITHUB_OUTPUT}"
          echo "format=${format}" >> "${GITHUB_OUTPUT}"
          echo "quality=${quality}" >> "${GITHUB_OUTPUT}"
          echo "full_workspace=${full_workspace}" >> "${GITHUB_OUTPUT}"
          echo "benchmark_tests=${benchmark_tests}" >> "${GITHUB_OUTPUT}"
          echo "compatibility_tests=${compatibility_tests}" >> "${GITHUB_OUTPUT}"
          echo "ci_classifier_tests=${ci_classifier_tests}" >> "${GITHUB_OUTPUT}"
          echo "native_manifest_tests=${native_manifest_tests}" >> "${GITHUB_OUTPUT}"
          echo "provision_zig_tests=${provision_zig_tests}" >> "${GITHUB_OUTPUT}"
          echo "compatibility=${compatibility}" >> "${GITHUB_OUTPUT}"
          echo "release_smoke=${release_smoke}" >> "${GITHUB_OUTPUT}"
          echo "dependency_audit=${dependency_audit}" >> "${GITHUB_OUTPUT}"
          echo "native_matrix=${native_matrix}" >> "${GITHUB_OUTPUT}"
          echo "unsupported=${unsupported}" >> "${GITHUB_OUTPUT}"
          echo "test_support=${test_support}" >> "${GITHUB_OUTPUT}"
          echo "core_api_docs=${core_api_docs}" >> "${GITHUB_OUTPUT}"
          echo "testkit_docs=${testkit_docs}" >> "${GITHUB_OUTPUT}"
          echo "compatibility_docs=${compatibility_docs}" >> "${GITHUB_OUTPUT}"
          echo "vision_docs=${vision_docs}" >> "${GITHUB_OUTPUT}"

  documentation-policy:
    name: Documentation policy
    needs: change-classification
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation policy
        run: python3 scripts/check_documentation.py
      - name: Test documentation policy
        run: python3 -m unittest --verbose tests/test_documentation_policy.py
      - name: Install exact Rust toolchain for focused contract checks
        if: ${{ needs.change-classification.outputs.core_api_docs == 'true' || needs.change-classification.outputs.testkit_docs == 'true' || needs.change-classification.outputs.vision_docs == 'true' }}
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Test core API documentation
        if: ${{ needs.change-classification.outputs.core_api_docs == 'true' }}
        run: cargo +"${RUST_TOOLCHAIN}" test --locked --doc -p machine-god-core
      - name: Test testkit documentation
        if: ${{ needs.change-classification.outputs.testkit_docs == 'true' }}
        run: cargo +"${RUST_TOOLCHAIN}" test --locked --doc -p machine-god-testkit
      - name: Check pinned upstream compatibility inventory
        if: ${{ needs.change-classification.outputs.compatibility_docs == 'true' }}
        run: python3 scripts/generate_compatibility.py --check-rendered-docs
      - name: Check vision documentation agreement
        if: ${{ needs.change-classification.outputs.vision_docs == 'true' }}
        run: |
          cargo +"${RUST_TOOLCHAIN}" fetch --locked
          python3 -m unittest --verbose tests.test_native_manifest.NativeManifestTests.test_vision_portable_contract_and_native_edges_are_feature_scoped

  quality:
    name: Quality and tests
    needs: change-classification
    if: ${{ needs.change-classification.outputs.quality == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        if: ${{ needs.change-classification.outputs.core == 'true' || needs.change-classification.outputs.testkit == 'true' || needs.change-classification.outputs.native == 'true' || needs.change-classification.outputs.cli == 'true' || needs.change-classification.outputs.format == 'true' || needs.change-classification.outputs.native_manifest_tests == 'true' || needs.change-classification.outputs.release_smoke == 'true' }}
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
      - name: Formatting configuration
        if: ${{ needs.change-classification.outputs.format == 'true' }}
        run: cargo +"${RUST_TOOLCHAIN}" fmt --all -- --check
      - name: Formatting
        if: ${{ needs.change-classification.outputs.format != 'true' && (needs.change-classification.outputs.core == 'true' || needs.change-classification.outputs.testkit == 'true' || needs.change-classification.outputs.native == 'true' || needs.change-classification.outputs.cli == 'true') }}
        env: &affected-packages
          FULL_WORKSPACE: ${{ needs.change-classification.outputs.full_workspace }}
          CORE: ${{ needs.change-classification.outputs.core }}
          TESTKIT: ${{ needs.change-classification.outputs.testkit }}
          NATIVE: ${{ needs.change-classification.outputs.native }}
          CLI: ${{ needs.change-classification.outputs.cli }}
        run: |
          set -euo pipefail
          packages=()
          if [[ "${FULL_WORKSPACE}" == "true" ]]; then
            packages+=(--all)
          else
            [[ "${CORE}" == "true" ]] && packages+=(--package machine-god-core)
            [[ "${TESTKIT}" == "true" ]] && packages+=(--package machine-god-testkit)
            [[ "${NATIVE}" == "true" ]] && packages+=(--package machine-god-native)
            [[ "${CLI}" == "true" ]] && packages+=(--package machine-god-cli)
          fi
          cargo +"${RUST_TOOLCHAIN}" fmt "${packages[@]}" -- --check
      - name: Clippy
        if: ${{ needs.change-classification.outputs.core == 'true' || needs.change-classification.outputs.testkit == 'true' || needs.change-classification.outputs.native == 'true' || needs.change-classification.outputs.cli == 'true' }}
        env: *affected-packages
        run: |
          set -euo pipefail
          packages=()
          if [[ "${FULL_WORKSPACE}" == "true" ]]; then
            packages+=(--workspace)
          else
            [[ "${CORE}" == "true" ]] && packages+=(--package machine-god-core)
            [[ "${TESTKIT}" == "true" ]] && packages+=(--package machine-god-testkit)
            [[ "${NATIVE}" == "true" ]] && packages+=(--package machine-god-native)
            [[ "${CLI}" == "true" ]] && packages+=(--package machine-god-cli)
          fi
          cargo +"${RUST_TOOLCHAIN}" clippy --locked "${packages[@]}" --all-targets --all-features -- -D warnings
      - name: Tests
        if: ${{ needs.change-classification.outputs.core == 'true' || needs.change-classification.outputs.testkit == 'true' || needs.change-classification.outputs.native == 'true' || needs.change-classification.outputs.cli == 'true' }}
        env: *affected-packages
        run: |
          set -euo pipefail
          packages=()
          if [[ "${FULL_WORKSPACE}" == "true" ]]; then
            packages+=(--workspace)
          else
            [[ "${CORE}" == "true" ]] && packages+=(--package machine-god-core)
            [[ "${TESTKIT}" == "true" ]] && packages+=(--package machine-god-testkit)
            [[ "${NATIVE}" == "true" ]] && packages+=(--package machine-god-native)
            [[ "${CLI}" == "true" ]] && packages+=(--package machine-god-cli)
          fi
          cargo +"${RUST_TOOLCHAIN}" test --locked "${packages[@]}"
      - name: Documentation tests
        if: ${{ needs.change-classification.outputs.full_workspace == 'true' || needs.change-classification.outputs.core == 'true' || needs.change-classification.outputs.testkit == 'true' || needs.change-classification.outputs.native == 'true' }}
        env: *affected-packages
        run: |
          set -euo pipefail
          packages=()
          if [[ "${FULL_WORKSPACE}" == "true" ]]; then
            packages+=(--workspace)
          else
            [[ "${CORE}" == "true" ]] && packages+=(--package machine-god-core)
            [[ "${TESTKIT}" == "true" ]] && packages+=(--package machine-god-testkit)
            [[ "${NATIVE}" == "true" ]] && packages+=(--package machine-god-native)
          fi
          cargo +"${RUST_TOOLCHAIN}" test --locked --doc "${packages[@]}"
      - name: Format standalone reentrant-waker test support
        if: ${{ needs.change-classification.outputs.format == 'true' || needs.change-classification.outputs.test_support == 'true' }}
        run: cargo +"${RUST_TOOLCHAIN}" fmt --manifest-path test-support/reentrant-waker/Cargo.toml -- --check
      - name: Clippy standalone reentrant-waker test support
        if: ${{ needs.change-classification.outputs.test_support == 'true' }}
        run: cargo +"${RUST_TOOLCHAIN}" clippy --locked --manifest-path test-support/reentrant-waker/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Test standalone reentrant-waker test support
        if: ${{ needs.change-classification.outputs.test_support == 'true' }}
        run: cargo +"${RUST_TOOLCHAIN}" test --locked --manifest-path test-support/reentrant-waker/Cargo.toml --all-targets --all-features
      - name: Test benchmark harness
        if: ${{ needs.change-classification.outputs.benchmark_tests == 'true' }}
        run: python3 -m unittest --verbose benchmarks/test_benchmarks.py
      - name: Test compatibility generator
        if: ${{ needs.change-classification.outputs.compatibility_tests == 'true' }}
        run: python3 -m unittest --verbose compatibility/test_generate_compatibility.py
      - name: Test CI change classification
        if: ${{ needs.change-classification.outputs.ci_classifier_tests == 'true' }}
        run: python3 -m unittest --verbose tests/test_ci_change_classification.py
      - name: Fetch locked native-manifest test dependencies
        if: ${{ needs.change-classification.outputs.native_manifest_tests == 'true' }}
        run: cargo +"${RUST_TOOLCHAIN}" fetch --locked
      - name: Test native manifest agreements
        if: ${{ needs.change-classification.outputs.native_manifest_tests == 'true' }}
        run: python3 -m unittest --verbose tests/test_native_manifest.py
      - name: Test Zig provisioner
        if: ${{ needs.change-classification.outputs.provision_zig_tests == 'true' }}
        run: python3 -m unittest --verbose tests/test_provision_zig.py
      - name: Check pinned upstream compatibility inventory
        if: ${{ needs.change-classification.outputs.compatibility == 'true' }}
        env:
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          from scripts.generate_compatibility import parse_lock

          lock = parse_lock(Path("benchmarks/upstream.lock"))
          upstream = Path(
              tempfile.mkdtemp(prefix="fx-compatibility-", dir=os.environ["RUNNER_TEMP"])
          )
          git_environment = os.environ.copy()
          for name in ("GH_TOKEN", "GITHUB_TOKEN", "SSH_AUTH_SOCK"):
              git_environment.pop(name, None)
          git_environment["GIT_ASKPASS"] = "/bin/false"
          git_environment["GIT_TERMINAL_PROMPT"] = "0"
          git = [
              "git",
              "-c",
              "credential.helper=",
              "-c",
              "core.askPass=/bin/false",
              "-c",
              "http.extraHeader=",
              "-C",
              str(upstream),
          ]

          subprocess.run(["git", "init", "--quiet", str(upstream)], check=True, env=git_environment)
          subprocess.run(
              [*git, "remote", "add", "origin", lock["repository"]],
              check=True,
              env=git_environment,
          )
          subprocess.run(
              [*git, "fetch", "--depth=1", "origin", lock["commit"]],
              check=True,
              env=git_environment,
          )
          subprocess.run(
              [*git, "checkout", "--quiet", "--detach", lock["commit"]],
              check=True,
              env=git_environment,
          )
          head = subprocess.run(
              [*git, "rev-parse", "HEAD"],
              check=True,
              capture_output=True,
              text=True,
              env=git_environment,
          ).stdout.strip()
          if head != lock["commit"]:
              raise SystemExit(f"upstream checkout is {head}, expected {lock['commit']}")
          subprocess.run(
              [
                  sys.executable,
                  "scripts/generate_compatibility.py",
                  "--upstream",
                  str(upstream),
                  "--check",
              ],
              check=True,
              env=git_environment,
          )
          PY
      - name: Release smoke test
        if: ${{ needs.change-classification.outputs.release_smoke == 'true' }}
        run: |
          cargo +"${RUST_TOOLCHAIN}" build --locked --release -p machine-god-cli
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import stat
          import subprocess
          import tempfile
          from pathlib import Path

          binary = Path("target/release/machine-god").resolve()
          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve()
          root = Path(tempfile.mkdtemp(prefix="machine-god-doctor-", dir=runner_temp))
          config_root = root / "missing-config"
          state_root = root / "missing-state"
          home = root / "missing-home"
          environment = os.environ.copy()
          environment.update(
              {
                  "XDG_CONFIG_HOME": str(config_root),
                  "XDG_STATE_HOME": str(state_root),
                  "HOME": str(home),
              }
          )
          environment.pop("VERCEL_OIDC_TOKEN", None)
          environment.pop("AI_GATEWAY_API_KEY", None)

          def run(*arguments: str) -> subprocess.CompletedProcess[str]:
              return subprocess.run(
                  [str(binary), *arguments],
                  check=False,
                  capture_output=True,
                  text=True,
                  env=environment,
              )

          help_results = [
              run("help", "ignored-tail"),
              run("--help", "--json", "ignored-tail"),
              run("-h", "status", "ignored-tail"),
          ]
          if any(result.returncode != 0 or result.stderr for result in help_results):
              raise SystemExit(f"help alias smoke failed: {help_results!r}")
          if len({result.stdout for result in help_results}) != 1:
              raise SystemExit("help aliases were not byte-identical")
          help_text = help_results[0].stdout
          for fragment in (
              "machine-god 0.1.0\n",
              "Commands:\n",
              "  help         Show this help\n",
              "  status       Show configuration and runtime information\n",
              "Options:\n",
          ):
              if fragment not in help_text:
                  raise SystemExit(f"help smoke omitted {fragment!r}")
          if not help_text.endswith("\n") or "\x1b" in help_text:
              raise SystemExit("help framing or plain-output contract changed")

          status_help_expected = (
              "machine-god status\n\n"
              "Show configuration and runtime information\n\n"
              "Usage:\n"
              "  machine-god status [--json]\n\n"
              "Options:\n"
              "  --json  Emit machine-readable JSON instead of text\n"
          )
          for arguments in (
              ("status", "--help"),
              ("status", "unknown", "--json", "-h", "ignored"),
          ):
              result = run(*arguments)
              if result.returncode != 0 or result.stdout != status_help_expected or result.stderr:
                  raise SystemExit(f"status help smoke failed: {result!r}")

          status_human = run("status")
          status_machine = run("status", "--json")
          status_repeated = run("status", "--json", "--json", "--json")
          if any(result.returncode != 0 or result.stderr for result in (status_human, status_machine, status_repeated)):
              raise SystemExit(
                  "status smoke exits: "
                  f"human={status_human.returncode} json={status_machine.returncode} "
                  f"repeated={status_repeated.returncode}"
          )
          workspace = str(Path.cwd().resolve())
          revision_candidate = os.environ.get("MACHINE_GOD_BUILD_REVISION", "")
          revision = (
              revision_candidate
              if 1 <= len(revision_candidate) <= 12
              and all(character in "0123456789abcdefABCDEF" for character in revision_candidate)
              else ""
          )
          expected_status_human = (
              "[status] model=zai/glm-5.2\n"
              "[status] update_channel=stable\n"
              "[status] build_channel=stable\n"
          )
          if revision:
              expected_status_human += f"[status] build_revision={revision}\n"
          expected_status_human += (
              "[status] auth=missing\n"
              "[status] auth_refreshable=false\n"
              "[status] auth_help=Machine God needs access to Vercel AI Gateway. "
              "Set VERCEL_OIDC_TOKEN or AI_GATEWAY_API_KEY.\n"
              "[status] permission_mode=ask\n"
              "[status] sandbox=none\n"
              f"[status] workspace={workspace}\n"
              "[status] history_turns=0\n"
              "[status] session_permission_grants=0\n"
              "[status] agent_step_limit=8\n"
          )
          if status_human.stdout != expected_status_human:
              raise SystemExit(f"unexpected human status output: {status_human.stdout!r}")
          if status_repeated.stdout != status_machine.stdout:
              raise SystemExit("repeated status --json was not idempotent")
          status_report = json.loads(status_machine.stdout)
          if list(status_report) != [
              "kind",
              "model",
              "update_channel",
              "build_channel",
              "build_revision",
              "auth",
              "auth_refreshable",
              "auth_help",
              "permission_mode",
              "sandbox",
              "workspace",
              "history_turns",
              "session_permission_grants",
              "agent_step_limit",
          ]:
              raise SystemExit("status JSON top-level key order changed")
          if status_report != {
              "kind": "status",
              "model": "zai/glm-5.2",
              "update_channel": "stable",
              "build_channel": "stable",
              "build_revision": revision,
              "auth": "missing",
              "auth_refreshable": False,
              "auth_help": (
                  "Machine God needs access to Vercel AI Gateway. "
                  "Set VERCEL_OIDC_TOKEN or AI_GATEWAY_API_KEY."
              ),
              "permission_mode": "ask",
              "sandbox": "none",
              "workspace": workspace,
              "history_turns": 0,
              "session_permission_grants": 0,
              "agent_step_limit": 8,
          }:
              raise SystemExit(f"unexpected status JSON payload: {status_report!r}")
          expected_status_machine = json.dumps(
              status_report,
              ensure_ascii=False,
              separators=(",", ":"),
          ) + "\n"
          if status_machine.stdout != expected_status_machine:
              raise SystemExit("status JSON was not compact or exactly LF-terminated")
          if any(len(result.stdout.encode()) > 65_536 for result in (status_human, status_machine, status_repeated)):
              raise SystemExit("status output bound changed")

          invalid_status_human = run("status", "unknown")
          if (
              invalid_status_human.returncode != 1
              or invalid_status_human.stdout
              or invalid_status_human.stderr != "usage: machine-god status [--json]\n"
          ):
              raise SystemExit(f"unexpected human status parse failure: {invalid_status_human!r}")
          invalid_status_json = run("status", "unknown", "--json")
          if (
              invalid_status_json.returncode != 1
              or invalid_status_json.stderr
              or invalid_status_json.stdout
              != '{"kind":"status","error":"invalid arguments","code":"InvalidLocalSurfaceArgs"}\n'
          ):
              raise SystemExit(f"unexpected JSON status parse failure: {invalid_status_json!r}")
          if any(path.exists() for path in (config_root, state_root, home)):
              raise SystemExit("help/status created an isolated missing root")

          human = run("doctor")
          machine = run("doctor", "--json")
          if human.returncode != 0 or machine.returncode != 0:
              raise SystemExit(f"doctor smoke exits: human={human.returncode} json={machine.returncode}")
          if human.stderr or machine.stderr:
              raise SystemExit("doctor smoke wrote unexpected stderr")

          expected_lines = [
              "[doctor] ok=1 warn=2 fail=1",
              "[warn] config: configuration file is missing; using built-in defaults",
              "[fail] credential: no AI Gateway credential is configured",
              "[warn] state: state directory is not initialized",
              "[ok] platform: native host platform is supported",
          ]
          if human.stdout != "\n".join(expected_lines) + "\n":
              raise SystemExit(f"unexpected human doctor output: {human.stdout!r}")
          if len(human.stdout.encode()) > 4096:
              raise SystemExit("doctor human output bound changed")

          report = json.loads(machine.stdout)
          if list(report) != ["kind", "ok_count", "warn_count", "fail_count", "checks"]:
              raise SystemExit("doctor JSON top-level key order changed")
          if report["kind"] != "doctor" or (report["ok_count"], report["warn_count"], report["fail_count"]) != (1, 2, 1):
              raise SystemExit(f"unexpected doctor counts: {report!r}")
          checks = report["checks"]
          if len(checks) != 4 or sum(report[name] for name in ("ok_count", "warn_count", "fail_count")) != 4:
              raise SystemExit("doctor count/check consistency failed")
          for check, line in zip(checks, expected_lines[1:], strict=True):
              if list(check) != ["name", "status", "detail"]:
                  raise SystemExit("doctor JSON check key order changed")
              if line != f"[{check['status']}] {check['name']}: {check['detail']}":
                  raise SystemExit("doctor human/JSON check mismatch")
          if not machine.stdout.endswith("\n") or len(machine.stdout.encode()) > 4096:
              raise SystemExit("doctor JSON framing or output bound changed")
          if any(path.exists() for path in (config_root, state_root, home)):
              raise SystemExit("doctor created an isolated missing root")

          workspace_smoke_root = Path(
              tempfile.mkdtemp(prefix="machine-god-workspace-", dir=runner_temp)
          )
          workspace_root = (workspace_smoke_root / "primary workspace").resolve()
          workspace_root.mkdir()
          workspace_config_root = workspace_smoke_root / "missing-config"
          workspace_state_root = workspace_smoke_root / "missing-state"
          workspace_home = workspace_smoke_root / "missing-home"
          workspace_environment = os.environ.copy()
          workspace_environment.update(
              {
                  "XDG_CONFIG_HOME": str(workspace_config_root),
                  "XDG_STATE_HOME": str(workspace_state_root),
                  "HOME": str(workspace_home),
              }
          )
          workspace_environment.pop("VERCEL_OIDC_TOKEN", None)
          workspace_environment.pop("AI_GATEWAY_API_KEY", None)

          def run_workspace(*arguments: str) -> subprocess.CompletedProcess[str]:
              return subprocess.run(
                  [str(binary), *arguments],
                  check=False,
                  capture_output=True,
                  text=True,
                  cwd=workspace_root,
                  env=workspace_environment,
              )

          workspace_human_default = run_workspace("workspace")
          workspace_human_list = run_workspace("workspace", "list")
          workspace_json_default = run_workspace("workspace", "--json")
          workspace_json_list = run_workspace("workspace", "list", "--json")
          workspace_results = (
              workspace_human_default,
              workspace_human_list,
              workspace_json_default,
              workspace_json_list,
          )
          if any(result.returncode != 0 for result in workspace_results):
              raise SystemExit(
                  "workspace smoke exits: "
                  + ", ".join(str(result.returncode) for result in workspace_results)
              )
          if any(result.stderr for result in workspace_results):
              raise SystemExit("workspace smoke wrote unexpected stderr")

          encoded_workspace_path = json.dumps(str(workspace_root), ensure_ascii=False)
          expected_workspace_human = (
              f"[workspace] primary={encoded_workspace_path}\n"
              "[workspace] additional_directories=unsupported\n"
          )
          if workspace_human_default.stdout != expected_workspace_human:
              raise SystemExit(
                  f"unexpected default human workspace output: {workspace_human_default.stdout!r}"
              )
          if workspace_human_list.stdout != expected_workspace_human:
              raise SystemExit(
                  f"unexpected explicit-list workspace output: {workspace_human_list.stdout!r}"
              )

          expected_workspace_json = (
              json.dumps(
                  {
                      "kind": "workspace",
                      "action": "list",
                      "primary_directory": str(workspace_root),
                      "additional_directories_supported": False,
                      "additional_directories": [],
                  },
                  ensure_ascii=False,
                  separators=(",", ":"),
              )
              + "\n"
          )
          if workspace_json_default.stdout != expected_workspace_json:
              raise SystemExit(
                  f"unexpected default JSON workspace output: {workspace_json_default.stdout!r}"
              )
          if workspace_json_list.stdout != expected_workspace_json:
              raise SystemExit(
                  f"unexpected explicit-list JSON workspace output: {workspace_json_list.stdout!r}"
              )
          workspace_report = json.loads(workspace_json_default.stdout)
          if list(workspace_report) != [
              "kind",
              "action",
              "primary_directory",
              "additional_directories_supported",
              "additional_directories",
          ]:
              raise SystemExit("workspace JSON top-level key order changed")
          if any(len(result.stdout.encode()) > 32768 for result in workspace_results):
              raise SystemExit("workspace success output bound changed")
          if list(workspace_root.iterdir()):
              raise SystemExit("workspace inspection changed its dedicated current directory")
          if any(
              path.exists()
              for path in (workspace_config_root, workspace_state_root, workspace_home)
          ):
              raise SystemExit("workspace inspection created an isolated missing root")

          sessions_root = Path(
              tempfile.mkdtemp(prefix="machine-god-sessions-", dir=runner_temp)
          )
          sessions_config_root = sessions_root / "missing-config"
          sessions_state_root = sessions_root / "missing-state"
          sessions_home = sessions_root / "missing-home"
          sessions_environment = os.environ.copy()
          sessions_environment.update(
              {
                  "XDG_CONFIG_HOME": str(sessions_config_root),
                  "XDG_STATE_HOME": str(sessions_state_root),
                  "HOME": str(sessions_home),
              }
          )
          sessions_environment.pop("VERCEL_OIDC_TOKEN", None)
          sessions_environment.pop("AI_GATEWAY_API_KEY", None)

          def run_sessions(*arguments: str) -> subprocess.CompletedProcess[str]:
              return subprocess.run(
                  [str(binary), *arguments],
                  check=False,
                  capture_output=True,
                  text=True,
                  env=sessions_environment,
              )

          sessions_human = run_sessions("sessions")
          sessions_machine = run_sessions("sessions", "--json")
          if sessions_human.returncode != 0 or sessions_machine.returncode != 0:
              raise SystemExit(
                  "sessions smoke exits: "
                  f"human={sessions_human.returncode} json={sessions_machine.returncode}"
              )
          if sessions_human.stderr or sessions_machine.stderr:
              raise SystemExit("sessions smoke wrote unexpected stderr")
          if sessions_human.stdout != "[sessions] no saved sessions\n":
              raise SystemExit(f"unexpected human sessions output: {sessions_human.stdout!r}")
          sessions_report = json.loads(sessions_machine.stdout)
          if list(sessions_report) != ["kind", "count", "truncated", "sessions"]:
              raise SystemExit("sessions JSON top-level key order changed")
          if sessions_report != {
              "kind": "sessions",
              "count": 0,
              "truncated": False,
              "sessions": [],
          }:
              raise SystemExit(f"unexpected sessions JSON report: {sessions_report!r}")
          if not sessions_machine.stdout.endswith("\n"):
              raise SystemExit("sessions JSON lost its final LF")
          if any(
              path.exists()
              for path in (sessions_config_root, sessions_state_root, sessions_home)
          ):
              raise SystemExit("sessions created an isolated missing root")

          background_root = Path(
              tempfile.mkdtemp(prefix="machine-god-background-", dir=runner_temp)
          )
          background_workspace = (background_root / "workspace").resolve()
          background_workspace.mkdir(mode=0o700)
          background_config_root = background_root / "missing-config"
          background_state_root = background_root / "missing-state"
          background_home = background_root / "missing-home"
          background_environment = os.environ.copy()
          background_environment.update(
              {
                  "XDG_CONFIG_HOME": str(background_config_root),
                  "XDG_STATE_HOME": str(background_state_root),
                  "HOME": str(background_home),
              }
          )
          background_environment.pop("VERCEL_OIDC_TOKEN", None)
          background_environment.pop("AI_GATEWAY_API_KEY", None)

          def run_background(*arguments: str) -> subprocess.CompletedProcess[str]:
              return subprocess.run(
                  [str(binary), *arguments],
                  check=False,
                  capture_output=True,
                  text=True,
                  cwd=background_workspace,
                  env=background_environment,
              )

          background_human = run_background("background")
          background_machine = run_background("background", "--json")
          if background_human.returncode != 0 or background_machine.returncode != 0:
              raise SystemExit(
                  "background smoke exits: "
                  f"human={background_human.returncode} json={background_machine.returncode}"
              )
          if background_human.stderr or background_machine.stderr:
              raise SystemExit("background smoke wrote unexpected stderr")
          if background_human.stdout != "[background] no persisted background records\n":
              raise SystemExit(
                  f"unexpected human background output: {background_human.stdout!r}"
              )
          expected_background_json = (
              '{"kind":"background","count":0,'
              '"truncated":false,"records":[]}\n'
          )
          if background_machine.stdout != expected_background_json:
              raise SystemExit(
                  f"unexpected JSON background output: {background_machine.stdout!r}"
              )
          background_report = json.loads(background_machine.stdout)
          if list(background_report) != ["kind", "count", "truncated", "records"]:
              raise SystemExit("background JSON top-level key order changed")
          if len(background_machine.stdout.encode()) > 65_536:
              raise SystemExit("background JSON output bound changed")
          if list(background_workspace.iterdir()):
              raise SystemExit("background inspection changed its dedicated current directory")
          if any(
              path.exists()
              for path in (
                  background_config_root,
                  background_state_root,
                  background_home,
              )
          ):
              raise SystemExit("background inspection created an isolated missing root")

          session_root = Path(
              tempfile.mkdtemp(prefix="machine-god-session-", dir=runner_temp)
          )
          session_config_root = session_root / "missing-config"
          session_state_root = session_root / "state"
          session_store_root = session_state_root / "machine-god"
          session_home = session_root / "missing-home"
          session_state_root.mkdir(mode=0o700)
          session_store_root.mkdir(mode=0o700)
          session_id = "ci-session"
          session_incarnation = "ci-incarnation"
          session_record = {
              "schema_version": 1,
              "record": {
                  "id": session_id,
                  "incarnation_id": session_incarnation,
                  "revision": 7,
                  "next_turn_sequence": 4,
                  "messages": [
                      {"role": "user", "content": [{"type": "text", "text": "private"}]},
                  ],
                  "metadata": {"private-key": "private-value"},
              },
          }
          session_bytes = json.dumps(
              session_record, separators=(",", ":"), ensure_ascii=True
          ).encode()
          session_digest = hashlib.sha256(
              b"machine-god:file-session:v1:" + session_id.encode()
          ).hexdigest()
          session_data = session_store_root / f"session-{session_digest}.json"
          session_lock = session_store_root / f"session-{session_digest}.lock"
          session_data.write_bytes(session_bytes)
          session_data.chmod(0o600)
          session_environment = os.environ.copy()
          session_environment.update(
              {
                  "XDG_CONFIG_HOME": str(session_config_root),
                  "XDG_STATE_HOME": str(session_state_root),
                  "HOME": str(session_home),
                  "VERCEL_OIDC_TOKEN": "ignored invalid credential",
                  "AI_GATEWAY_API_KEY": "ignored lower credential",
              }
          )

          def run_session(*arguments: str) -> subprocess.CompletedProcess[str]:
              return subprocess.run(
                  [str(binary), *arguments],
                  check=False,
                  capture_output=True,
                  text=True,
                  env=session_environment,
              )

          session_human = run_session("session", session_id)
          session_machine = run_session("session", session_id, "--json")
          session_missing = run_session("session", "missing-session")
          if session_human.returncode != 0 or session_machine.returncode != 0:
              raise SystemExit(
                  "session smoke exits: "
                  f"human={session_human.returncode} json={session_machine.returncode}"
              )
          if session_human.stderr or session_machine.stderr:
              raise SystemExit("session success smoke wrote unexpected stderr")
          expected_session_human = (
              "[session] ci-session\n"
              " - incarnation_id: ci-incarnation\n"
              " - revision: 7\n"
              " - next_turn_sequence: 4\n"
              " - message_count: 1\n"
              " - metadata_entry_count: 1\n"
          )
          if session_human.stdout != expected_session_human:
              raise SystemExit(f"unexpected human session output: {session_human.stdout!r}")
          expected_session_json = (
              '{"kind":"session","id":"ci-session",'
              '"incarnation_id":"ci-incarnation","revision":7,'
              '"next_turn_sequence":4,"message_count":1,'
              '"metadata_entry_count":1}\n'
          )
          if session_machine.stdout != expected_session_json:
              raise SystemExit(f"unexpected JSON session output: {session_machine.stdout!r}")
          session_report = json.loads(session_machine.stdout)
          if list(session_report) != [
              "kind",
              "id",
              "incarnation_id",
              "revision",
              "next_turn_sequence",
              "message_count",
              "metadata_entry_count",
          ]:
              raise SystemExit("session JSON top-level key order changed")
          if any(len(output.stdout.encode()) > 4096 for output in (session_human, session_machine)):
              raise SystemExit("session success output bound changed")
          if session_missing.returncode != 1 or session_missing.stdout:
              raise SystemExit(f"unexpected missing session exit/output: {session_missing!r}")
          if session_missing.stderr != (
              "machine-god session: could not inspect session: NotFound\n"
          ):
              raise SystemExit(f"unexpected missing session error: {session_missing.stderr!r}")
          if session_data.read_bytes() != session_bytes:
              raise SystemExit("session inspection rewrote the record")
          if not session_lock.is_file() or stat.S_IMODE(session_lock.stat().st_mode) != 0o600:
              raise SystemExit("session inspection did not create an exact private lock sidecar")
          if session_config_root.exists() or session_home.exists():
              raise SystemExit("session inspection touched an unrelated root")
          PY

  security:
    name: Dependency policy and vulnerability audit
    needs: change-classification
    if: ${{ needs.change-classification.outputs.dependency_audit == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Install exact cargo-deny
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}
        env:
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/security-tools
          CARGO_TARGET_DIR: ${{ runner.temp }}/security-tool-build
        run: cargo +"${RUST_TOOLCHAIN}" install cargo-deny --locked --version 0.20.2
      - name: Install exact cargo-audit
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}
        env:
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/security-tools
          CARGO_TARGET_DIR: ${{ runner.temp }}/security-tool-build
        run: cargo +"${RUST_TOOLCHAIN}" install cargo-audit --locked --version 0.22.2
      - name: Check dependency policy
        if: ${{ !cancelled() }}
        run: '"${RUNNER_TEMP}/security-tools/bin/cargo-deny" check'
      - name: Audit lockfile
        if: ${{ !cancelled() }}
        run: '"${RUNNER_TEMP}/security-tools/bin/cargo-audit" audit'

  native-target-tests:
    name: Native tests (${{ matrix.target }})
    needs: change-classification
    if: ${{ needs.change-classification.outputs.native_matrix == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust target
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "${{ matrix.target }}"
      - name: Test target natively
        if: ${{ !endsWith(matrix.target, '-apple-darwin') }}
        env: &native-affected-packages
          FULL_WORKSPACE: ${{ needs.change-classification.outputs.full_workspace }}
          CORE: ${{ needs.change-classification.outputs.core }}
          TESTKIT: ${{ needs.change-classification.outputs.testkit }}
          NATIVE: ${{ needs.change-classification.outputs.native }}
          CLI: ${{ needs.change-classification.outputs.cli }}
        run: |
          set -euo pipefail
          packages=()
          if [[ "${FULL_WORKSPACE}" == "true" ]]; then
            packages+=(--workspace)
          else
            [[ "${CORE}" == "true" ]] && packages+=(--package machine-god-core)
            [[ "${TESTKIT}" == "true" ]] && packages+=(--package machine-god-testkit)
            [[ "${NATIVE}" == "true" ]] && packages+=(--package machine-god-native)
            [[ "${CLI}" == "true" ]] && packages+=(--package machine-god-cli)
          fi
          cargo +"${RUST_TOOLCHAIN}" test --locked "${packages[@]}" --all-targets --all-features --target "${{ matrix.target }}"
      - name: Test Apple target natively without shared process-table contention
        if: ${{ endsWith(matrix.target, '-apple-darwin') }}
        env: *native-affected-packages
        run: |
          set -euo pipefail
          packages=()
          if [[ "${FULL_WORKSPACE}" == "true" ]]; then
            packages+=(--workspace)
          else
            [[ "${CORE}" == "true" ]] && packages+=(--package machine-god-core)
            [[ "${TESTKIT}" == "true" ]] && packages+=(--package machine-god-testkit)
            [[ "${NATIVE}" == "true" ]] && packages+=(--package machine-god-native)
            [[ "${CLI}" == "true" ]] && packages+=(--package machine-god-cli)
          fi
          cargo +"${RUST_TOOLCHAIN}" test --locked "${packages[@]}" --all-targets --all-features --target "${{ matrix.target }}" -- --test-threads=1

  unsupported-native-tools:
    name: Unsupported native tools (FreeBSD/WASI)
    needs: change-classification
    if: ${{ needs.change-classification.outputs.unsupported == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Rust target and Clippy
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --target x86_64-unknown-freebsd --target wasm32-wasip1
      - name: Compile unsupported-platform native surfaces for FreeBSD
        run: cargo +"${RUST_TOOLCHAIN}" clippy --locked -p machine-god-native --lib --test background_inspection_unsupported --test install_skill_unsupported --test memory_unsupported --test semantic_search_unsupported --test terminal_unsupported --test vision_unsupported --no-default-features --features vision --target x86_64-unknown-freebsd -- -D warnings
      - name: Compile unsupported-platform native surfaces for WASI
        run: cargo +"${RUST_TOOLCHAIN}" clippy --locked -p machine-god-native --lib --test background_inspection_unsupported --test terminal_unsupported --no-default-features --target wasm32-wasip1 -- -D warnings

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - change-classification
      - documentation-policy
      - quality
      - security
      - native-target-tests
      - unsupported-native-tools
    runs-on: ubuntu-latest
    steps:
      - name: Require the applicable checks
        env:
          CLASSIFICATION_RESULT: ${{ needs.change-classification.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation-policy.result }}
          QUALITY: ${{ needs.change-classification.outputs.quality }}
          DEPENDENCY_AUDIT: ${{ needs.change-classification.outputs.dependency_audit }}
          NATIVE_MATRIX: ${{ needs.change-classification.outputs.native_matrix }}
          UNSUPPORTED: ${{ needs.change-classification.outputs.unsupported }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          NATIVE_RESULT: ${{ needs.native-target-tests.result }}
          FREEBSD_RESULT: ${{ needs.unsupported-native-tools.result }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${CLASSIFICATION_RESULT}" != "success" ]]; then
            echo "change classification did not succeed: ${CLASSIFICATION_RESULT}" >&2
            exit 1
          fi
          if [[ "${DOCUMENTATION_RESULT}" != "success" ]]; then
            echo "documentation policy did not succeed: ${DOCUMENTATION_RESULT}" >&2
            exit 1
          fi

          require_result() {
            local selected="${1}"
            local result="${2}"
            local label="${3}"
            local expected
            case "${selected}" in
              true) expected=success ;;
              false) expected=skipped ;;
              *)
                echo "invalid ${label} classification: ${selected}" >&2
                exit 1
                ;;
            esac
            if [[ "${result}" != "${expected}" ]]; then
              echo "${label} job was ${result}; expected ${expected}" >&2
              exit 1
            fi
          }

          require_result "${QUALITY}" "${QUALITY_RESULT}" quality
          require_result "${DEPENDENCY_AUDIT}" "${SECURITY_RESULT}" security
          require_result "${NATIVE_MATRIX}" "${NATIVE_RESULT}" native-matrix
          require_result "${UNSUPPORTED}" "${FREEBSD_RESULT}" unsupported
