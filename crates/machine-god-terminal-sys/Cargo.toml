[package]
name = "machine-god-terminal-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
rustix.workspace = true

# Do not relax the production crates' workspace-wide forbid. Only the fixed
# PTY/identity/uptime bindings in ADR 0003 and read-only inventory binding in
# ADR 0004 may override this deny.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
