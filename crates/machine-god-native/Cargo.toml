[package]
name = "machine-god-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
ai-gateway-http = [
    "ai-gateway-model-catalog-http",
    "dep:base64",
    "dep:bytes",
    "web-fetch-http",
]
ai-gateway-model-catalog-http = [
    "dep:hickory-proto",
    "dep:hickory-resolver",
    "dep:hyper",
    "dep:reqwest",
    "dep:rustls",
    "dep:tokio",
    "dep:webpki-root-certs",
]
web-fetch-http = [
    "dep:hickory-proto",
    "dep:hickory-resolver",
    "dep:reqwest",
    "dep:rustls",
    "dep:tokio",
    "dep:webpki-root-certs",
]

[dependencies]
base64 = { workspace = true, optional = true }
futures-core.workspace = true
machine-god-core.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
calcifer-macos-acl.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
bytes = { workspace = true, optional = true }
getrandom.workspace = true
hickory-proto = { workspace = true, optional = true }
hickory-resolver = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
webpki-root-certs = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix.workspace = true

[dev-dependencies]
allocation-counter = "0.8.1"
futures-executor = "0.3.31"
futures-util = "0.3.31"
machine-god-reentrant-waker-test = { version = "=0.0.0", path = "../../test-support/reentrant-waker" }
machine-god-testkit = { version = "0.1.0", path = "../machine-god-testkit" }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
