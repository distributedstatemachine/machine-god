[workspace]
members = [
    "crates/machine-god-core",
    "crates/machine-god-native",
    "crates/machine-god-cli",
    "crates/machine-god-testkit",
]
exclude = ["test-support/reentrant-waker"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "Apache-2.0"
repository = "https://github.com/distributedstatemachine/machine-god"
publish = false

[workspace.dependencies]
futures-core = "0.3.31"
machine-god-core = { version = "0.1.0", path = "crates/machine-god-core" }
machine-god-native = { version = "0.1.0", path = "crates/machine-god-native" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
